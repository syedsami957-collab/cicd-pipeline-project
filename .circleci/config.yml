version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:18.0
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Run tests
          command: npm test

  build-and-push-docker:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - run:
          name: Build Docker image
          command: docker build -t $DOCKER_USERNAME/cicd-pipeline-project:latest .
      - run:
          name: Login to Docker Hub
          command: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - run:
          name: Push Docker image
          command: docker push $DOCKER_USERNAME/cicd-pipeline-project:latest

workflows:
  ci-pipeline:
    jobs:
      - build-and-test
      - build-and-push-docker:
          requires:
            - build-and-test